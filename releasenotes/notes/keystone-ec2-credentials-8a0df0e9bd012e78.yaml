---
features:
  - |
    The new ``SHOW_EC2_CREDENTIALS`` option has been added. Set this option to
    ``True`` to enable menus in API access panel to recreate or download EC2
    credentials. Currently these manus are enabled when the option is set
    to ``False`` but ``ec2`` service type and its endpoints are detected. This
    fallback will be removed in a future release.
