---
security:
  - |
    A new ``WEBSSO_ALLOWED_REFERER_HOSTS`` setting restricts which hosts are
    accepted in the ``Referer`` header when ``WEBSSO_USE_HTTP_REFERER`` is
    enabled. That header is supplied by the client, so without the list any
    unauthenticated caller of the WebSSO login endpoint can choose the host
    horizon sends the token request to. When the header names a host that is
    not listed, horizon logs a warning and falls back to
    ``OPENSTACK_KEYSTONE_URL``. The list is empty by default, which keeps the
    previous behaviour, so deployments using WebSSO should set it to the
    Keystone endpoints their identity providers redirect through. See
    `bug 2163119 <https://bugs.launchpad.net/horizon/+bug/2163119>`_.
