---
upgrade:
  - |
    The type, user and project of a user credential can no longer be changed
    from the Update User Credential form. Keystone made those attributes
    immutable and now rejects a request carrying them, so they are displayed
    for context but cannot be edited. Delete the credential and create a new
    one to change them.
fixes:
  - |
    Updating a user credential no longer fails with ``HTTP 400 Additional
    properties are not allowed``. ``api.keystone.credential_update()`` used to
    send the type, user and project along with the blob, which keystone
    rejects since it made those attributes immutable. Only the blob is sent
    now. The helper signature changed accordingly, from
    ``credential_update(request, credential_id, user, type, blob, project)``
    to ``credential_update(request, credential_id, blob)``.
