- project:
    queue: horizon
    templates:
      - check-requirements
      - horizon-cross-jobs
      - horizon-nodejs-jobs
      - horizon-non-primary-django-jobs
      - openstack-python3-jobs
      - periodic-stable-jobs
      - publish-openstack-docs-pti
      - release-notes-jobs-python3
    check:
      jobs:
        # py3.14 is only non-voting in the openstack-python3-jobs template.
        # Horizon already passes on py3.14, so make it voting to keep it
        # that way, as recommended by the 2026.2 testing runtime.
        - openstack-tox-py314:
            voting: true
        - horizon-selenium-headless
        - horizon-integration-pytest
        - horizon-ui-pytest
        - horizon-dsvm-tempest-plugin
        - horizon-tox-bandit-baseline
        - horizon-tempest-plugin-ipv6
    gate:
      jobs:
        - openstack-tox-py314
        - horizon-dsvm-tempest-plugin
        - horizon-selenium-headless
        - horizon-integration-pytest
        - horizon-ui-pytest
        - horizon-tempest-plugin-ipv6
    experimental:
      jobs:
        - horizon-integration-pytest-xstatic-master
        - horizon-tox-py310-xstatic-master
        - horizon-nodejs20-run-test-xstatic-master
    periodic:
      jobs:
        - horizon-nodejs20-run-test
        - horizon-integration-pytest
